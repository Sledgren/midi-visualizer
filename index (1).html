<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlitchRealm MIDI Visualizer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#07090f;font-family:'Inter',system-ui,sans-serif;color:#c8d4e0;overflow:hidden;font-size:13px}
#app{display:flex;flex-direction:column;width:100vw;height:100vh;position:fixed;top:0;left:0}

/* ── TOPBAR ── */
#topbar{display:flex;align-items:center;padding:0 16px;height:46px;background:#0e1018;border-bottom:1px solid #1a1f2e;flex-shrink:0;position:relative}
.logo{font-size:14px;font-weight:800;color:#22d3ee;letter-spacing:2px}
.preset-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.preset-lbl{font-size:10px;color:#334;letter-spacing:1px}
#presetSel{background:#0a0e18;border:1px solid #1e2535;color:#b0bfd0;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;outline:none;min-width:170px}
.topbar-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbtn{background:#0a0e18;border:1px solid #1e2535;color:#667;padding:0 12px;font-size:10px;letter-spacing:1px;cursor:pointer;border-radius:4px;height:26px;transition:all .15s}
.tbtn:hover{border-color:#22d3ee;color:#22d3ee}
.tbtn.act{background:#0d2535;border-color:#22d3ee;color:#22d3ee}

/* ── BODY ── */
#body{display:flex;flex:1;overflow:hidden;min-height:0}
#sidebar{width:188px;background:#0a0c14;border-right:1px solid #151a25;padding:10px 10px 20px;flex-shrink:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1a2030 transparent}
.sec{font-size:8px;letter-spacing:2.5px;color:#22d3ee;text-transform:uppercase;margin:14px 0 6px;opacity:.7}
.sec:first-child{margin-top:0}
.track-item{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:4px;margin-bottom:2px;background:#0e1018}
.t-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.t-name{font-size:10px;color:#8a9ab0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-mute{width:16px;height:16px;background:#151a25;border:none;color:#445;font-size:8px;cursor:pointer;border-radius:2px;flex-shrink:0;transition:all .1s}
.t-mute.on{color:#22d3ee;background:#0d2535}
.seg{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.sbtn{padding:3px 8px;font-size:9px;background:#0e1018;border:1px solid #1e2535;color:#445;cursor:pointer;border-radius:3px;transition:all .1s;letter-spacing:.5px}
.sbtn.on{background:#0d2535;border-color:#22d3ee;color:#22d3ee}
.sl-row{margin-bottom:7px}
.sl-lbl{font-size:9px;color:#445;margin-bottom:3px;display:flex;justify-content:space-between}
.sl-lbl span{color:#22d3ee}
input[type=range]{width:100%;height:2px;-webkit-appearance:none;background:#151a25;border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#22d3ee;cursor:pointer}
input[type=color]{width:100%;height:22px;border:1px solid #1e2535;background:#0e1018;cursor:pointer;border-radius:3px;padding:1px 3px}
.c-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.c-row label{font-size:9px;color:#445;flex:1}
.c-row input[type=color]{width:36px;flex-shrink:0}

/* ── VIZ ── */
#vizwrap{flex:1;position:relative;overflow:hidden}
canvas{display:block}

/* ── DROP SCREEN ── */
#dropscreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(7,9,15,.82)}
.drop-card{border:1px solid rgba(34,211,238,.18);border-radius:14px;padding:32px 36px;max-width:520px;width:90%;background:rgba(10,12,22,.9);backdrop-filter:blur(12px);text-align:center}
.drop-logo{font-size:22px;font-weight:800;color:#22d3ee;letter-spacing:3px;margin-bottom:4px}
.drop-sub{font-size:10px;color:#334;letter-spacing:2px;margin-bottom:24px}
.drop-zones{display:flex;gap:12px}
.dz{flex:1;border:1px dashed #1e2535;border-radius:10px;padding:24px 12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:7px}
.dz:hover,.dz.over{border-color:#22d3ee;background:rgba(34,211,238,.04)}
.dz.loaded-midi{border-color:#a78bfa;border-style:solid;background:rgba(167,139,250,.05)}
.dz.loaded-audio{border-color:#34d399;border-style:solid;background:rgba(52,211,153,.05)}
.dz-icon{font-size:26px}
.dz-label{font-size:10px;letter-spacing:2px;font-weight:700}
.dz-midi .dz-label{color:#a78bfa}
.dz-audio .dz-label{color:#34d399}
.dz-sub{font-size:9px;color:#2a3545;letter-spacing:.5px}
.dz-file{font-size:9px;margin-top:2px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dz-midi .dz-file{color:#a78bfa}
.dz-audio .dz-file{color:#34d399}

/* ── TRANSPORT ── */
#transport{display:flex;align-items:center;gap:10px;padding:7px 16px;background:#0a0c14;border-top:1px solid #151a25;flex-shrink:0}
.t-ctrl{background:#0e1018;border:1px solid #1e2535;color:#667;width:28px;height:28px;cursor:pointer;border-radius:4px;font-size:12px;transition:all .15s}
.t-ctrl:hover{border-color:#22d3ee;color:#22d3ee}
.t-ctrl.playing{border-color:#22d3ee;color:#22d3ee}
.prog-wrap{flex:1;height:3px;background:#151a25;border-radius:2px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:linear-gradient(to right,#22d3ee,#a78bfa);border-radius:2px;pointer-events:none;transition:width .05s linear}
.time-d{font-size:10px;color:#334;min-width:80px;text-align:right}
.bpm-d{font-size:10px;color:#334}
.bpm-d span{color:#22d3ee}
.vol-row{display:flex;align-items:center;gap:5px;flex-shrink:0}
.vol-row label{font-size:9px;color:#334}
.vol-row input{width:55px}

/* ── PRESET SWATCHES ── */
.swatch-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.swatch{width:18px;height:18px;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:border-color .1s;flex-shrink:0}
.swatch:hover,.swatch.on{border-color:#22d3ee}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <div class="logo">GLITCHREALM</div>
  <div class="preset-center">
    <span class="preset-lbl">Preset</span>
    <select id="presetSel" onchange="applyPreset(this.value)">
      <optgroup label="── 2026 Future">
        <option value="aurora">Aurora Ultra</option>
        <option value="obsidian">Obsidian Flame</option>
        <option value="neochrome">Neochrome</option>
        <option value="coldglass">Cold Glass</option>
      </optgroup>
      <optgroup label="── 1986 Retro">
        <option value="miami">Miami Vice</option>
        <option value="arcade">Arcade Fire</option>
        <option value="sunset">Sunset Blvd</option>
        <option value="laservid">Laser Vision</option>
      </optgroup>
      <optgroup label="── Classic">
        <option value="neon">Neon Glow</option>
        <option value="velvet">Velvet</option>
        <option value="matrix">Matrix</option>
        <option value="fire">Fire</option>
        <option value="ocean">Ocean</option>
      </optgroup>
    </select>
  </div>
  <div class="topbar-r">
    <button class="tbtn" id="exportVidBtn" onclick="doExport()">Export Video</button>
    <button class="tbtn" onclick="resetToDropScreen()">Reset</button>
  </div>
</div>

<div id="body">
<div id="sidebar">
  <div class="sec">Tracks</div>
  <div id="trackList"></div>

  <div class="sec">Note Shape</div>
  <div class="seg">
    <button class="sbtn on" onclick="setOpt('shape','rect',this)">Rect</button>
    <button class="sbtn" onclick="setOpt('shape','round',this)">Round</button>
    <button class="sbtn" onclick="setOpt('shape','line',this)">Line</button>
  </div>

  <div class="sec">FX</div>
  <div class="seg">
    <button class="sbtn on" id="fx-part" onclick="toggleFX('part',this)">Stars</button>
    <button class="sbtn on" id="fx-rip"  onclick="toggleFX('rip',this)">Ripple</button>
    <button class="sbtn on" id="fx-glow" onclick="toggleFX('glow',this)">Bloom</button>
    <button class="sbtn" id="fx-trail" onclick="toggleFX('trail',this)">Trail</button>
  </div>

  <div class="sec">Particles</div>
  <div class="c-row"><label>Color</label><input type="color" id="partColorPick" value="#22d3ee" oninput="partColor=this.value"></div>
  <div class="sl-row"><div class="sl-lbl">Count <span id="pcv">180</span></div><input type="range" min="0" max="600" value="180" oninput="partAmt=+this.value;document.getElementById('pcv').textContent=this.value;initStars()"></div>
  <div class="sl-row"><div class="sl-lbl">Size <span id="psv">1.8</span></div><input type="range" min="2" max="30" value="9" oninput="partSz=this.value/5;document.getElementById('psv').textContent=partSz.toFixed(1);initStars()"></div>
  <div class="sl-row"><div class="sl-lbl">Speed <span id="pspv">1.2</span></div><input type="range" min="1" max="20" value="6" oninput="partSpd=this.value/5;document.getElementById('pspv').textContent=(this.value/5).toFixed(1);initStars()"></div>

  <div class="sec">View</div>
  <div class="sl-row"><div class="sl-lbl">Depth <span id="dv">0.50</span></div><input type="range" min="0" max="100" value="50" oninput="depth=this.value/100;document.getElementById('dv').textContent=(this.value/100).toFixed(2)"></div>
  <div class="sl-row"><div class="sl-lbl">Zoom <span id="zv">0.4x</span></div><input type="range" min="1" max="40" value="4" oninput="zoom=this.value/10;document.getElementById('zv').textContent=zoom.toFixed(1)+'x'"></div>
  <div class="sl-row"><div class="sl-lbl">Note Height <span id="nhv">80%</span></div><input type="range" min="10" max="100" value="80" oninput="noteHPct=this.value/100;document.getElementById('nhv').textContent=this.value+'%'"></div>
  <div class="sl-row"><div class="sl-lbl">Bloom <span id="blv">18</span></div><input type="range" min="0" max="40" value="18" oninput="bloomR=+this.value;document.getElementById('blv').textContent=this.value"></div>

  <div class="sec">Background</div>
  <div class="c-row"><label>Color</label><input type="color" id="bgColorPick" value="#07090f" oninput="bgColor=this.value"></div>
</div>

<div id="vizwrap">
  <canvas id="viz"></canvas>
  <div id="dropscreen">
    <div class="drop-card">
      <div class="drop-logo">GLITCHREALM</div>
      <div class="drop-sub">MIDI VISUALIZER</div>
      <input type="file" id="midiIn" accept=".mid,.midi" style="display:none" onchange="handleMIDIFile(this.files[0])">
      <input type="file" id="audioIn" accept=".mp3,.wav,.m4a,.ogg,audio/*" style="display:none" onchange="handleAudioFile(this.files[0])">
      <div class="drop-zones">
        <label class="dz dz-midi" id="dzMidi" for="midiIn"
          ondragover="dzOver(event,'dzMidi')" ondragleave="dzLeave('dzMidi')" ondrop="dzDrop(event,'midi')">
          <div class="dz-icon">🎹</div>
          <div class="dz-label">MIDI FILE</div>
          <div class="dz-sub">.mid / .midi only</div>
          <div class="dz-file" id="midiFileName">no file loaded</div>
        </label>
        <label class="dz dz-audio" id="dzAudio" for="audioIn"
          ondragover="dzOver(event,'dzAudio')" ondragleave="dzLeave('dzAudio')" ondrop="dzDrop(event,'audio')">
          <div class="dz-icon">🔊</div>
          <div class="dz-label">AUDIO FILE</div>
          <div class="dz-sub">mp3 / wav / m4a only</div>
          <div class="dz-file" id="audioFileName">optional</div>
        </label>
      </div>
    </div>
  </div>
</div>
</div>

<div id="transport">
  <button class="t-ctrl" onclick="seek(0)">&#9664;&#9664;</button>
  <button class="t-ctrl" id="playBtn" onclick="togglePlay()">&#9654;</button>
  <div class="prog-wrap" id="progWrap">
    <div class="prog-fill" id="progFill" style="width:0%"></div>
  </div>
  <div class="time-d" id="timeD">0:00 / 0:00</div>
  <div class="bpm-d">BPM <span id="bpmD">—</span></div>
  <div class="vol-row"><label>VOL</label><input type="range" min="0" max="100" value="80" oninput="if(audioEl)audioEl.volume=this.value/100"></div>
</div>
</div>

<script>
// ── Canvas ──
const canvas=document.getElementById('viz');
const ctx=canvas.getContext('2d');
let W,H;
const vw=document.getElementById('vizwrap');

// ── ALL STATE FIRST — before any function calls ──
const TCOLORS=['#22d3ee','#a78bfa','#34d399','#f472b6','#60a5fa','#fb923c','#fbbf24','#4ade80','#f87171','#c084fc'];
let presetTracks=['#00ffcc','#00e5ff','#ff00aa','#ff6ef7','#7affff','#ff3de8','#00ffd5','#bf00ff','#44ffee','#ff44dd'];
let bgColor='#03080f',partColor='#00ffcc';
let shape='rect',depth=0.5,zoom=0.4,noteHPct=0.8,bloomR=18;
let partAmt=180,partSz=1.8,partSpd=1.2;
let fx={part:true,rip:true,glow:true,trail:false};
let tracks=[],notes=[],stars=[],ripples=[];
let playing=false,playPos=0,totalTicks=0,bpm=120,tpb=480;
let speed=1.0,lastT=null,audioEl=null,midiLoaded=false;
let vigCache=null;
let lastAudioTime=-1,lastAudioReadT=0;

function resize(){W=canvas.width=vw.clientWidth;H=canvas.height=vw.clientHeight;vigCache=null;}
window.addEventListener('resize',resize);resize();

// ── Presets ──
const PRESETS={
  aurora:  {bg:'#03080f',tracks:['#00ffcc','#00e5ff','#ff00aa','#ff6ef7','#7affff','#ff3de8','#00ffd5','#bf00ff','#44ffee','#ff44dd'],part:'#00ffcc'},
  obsidian:{bg:'#030303',tracks:['#ffffff','#ff4500','#ff7700','#ff2200','#ffe0cc','#ff6622','#ffffff','#ff3300','#ffaa66','#ff5500'],part:'#ff6622'},
  neochrome:{bg:'#050505',tracks:['#ff0080','#ff6600','#ffee00','#00ff88','#00ccff','#8800ff','#ff0055','#00ffdd','#ff3300','#44ff00'],part:'#ffffff'},
  coldglass:{bg:'#020408',tracks:['#e8f4ff','#aad4ff','#ffffff','#88bbff','#cce8ff','#ffffff','#99ccff','#ddeeff','#bbddff','#eef6ff'],part:'#aad4ff'},
  miami:   {bg:'#08020e',tracks:['#ff1493','#00e5ff','#ff69b4','#00ffff','#ff00aa','#40e0d0','#ff1493','#00ced1','#ff44aa','#33eeff'],part:'#ff1493'},
  arcade:  {bg:'#030300',tracks:['#ffee00','#ff2200','#00ff44','#ff8800','#ffcc00','#ff0033','#aaff00','#ff5500','#ffdd00','#33ff55'],part:'#ffee00'},
  sunset:  {bg:'#08020c',tracks:['#ff6b35','#ff3fa0','#ffb347','#cc44ff','#ff8c42','#ff1f8e','#ffaa44','#bb44ff','#ff7744','#ff55aa'],part:'#ff6b35'},
  laservid:{bg:'#020005',tracks:['#ff00ff','#00ffff','#ffffff','#ff44ff','#44ffff','#ff88ff','#88ffff','#ffaaff','#ff00ee','#00eeff'],part:'#ff00ff'},
  neon:    {bg:'#000810',tracks:['#22d3ee','#a78bfa','#34d399','#f472b6','#60a5fa','#fb923c','#22d3ee','#a78bfa','#34d399','#f472b6'],part:'#22d3ee'},
  velvet:  {bg:'#0a0010',tracks:['#c084fc','#e879f9','#a855f7','#d946ef','#7c3aed','#c026d3','#9333ea','#a21caf','#7e22ce','#86198f'],part:'#c084fc'},
  matrix:  {bg:'#000800',tracks:['#00ff41','#00cc33','#00ff41','#009922','#00ff88','#00aa44','#00ff41','#007711','#00ff66','#44ff88'],part:'#00ff41'},
  fire:    {bg:'#080000',tracks:['#ff4400','#ff8800','#ffcc00','#ff2200','#ff6600','#ffaa00','#ff3300','#ff7700','#ffbb00','#ff5500'],part:'#ff4400'},
  ocean:   {bg:'#000a10',tracks:['#0ea5e9','#38bdf8','#7dd3fc','#0284c7','#0369a1','#06b6d4','#22d3ee','#67e8f9','#a5f3fc','#0891b2'],part:'#22d3ee'},
};

function applyPreset(k){
  const p=PRESETS[k];if(!p)return;
  bgColor=p.bg;
  document.getElementById('bgColorPick').value=p.bg;
  partColor=p.part;
  document.getElementById('partColorPick').value=p.part;
  presetTracks=p.tracks;
  if(tracks.length)tracks.forEach((t,i)=>t.color=p.tracks[i%p.tracks.length]);
  buildTrackList();
  initStars();
}
function initStars(){
  stars=[];
  for(let i=0;i<partAmt;i++){
    stars.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*partSpd*.6+.1,
      vy:partSpd*.25+Math.random()*partSpd*.25,
      sz:partSz*(.4+Math.random()*.8),
      op:.2+Math.random()*.6,
      tw:Math.random()*Math.PI*2
    });
  }
}
function drawStars(){
  if(!fx.part||!stars.length)return;
  const t=Date.now()/1000;
  stars.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy;
    if(s.y>H){s.y=0;s.x=Math.random()*W;}
    if(s.x<0)s.x=W; if(s.x>W)s.x=0;
    ctx.globalAlpha=s.op*(.5+.5*Math.sin(t*1.3+s.tw));
    ctx.fillStyle=partColor;
    ctx.beginPath();ctx.arc(s.x,s.y,s.sz,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ── Vignette cache ──
function getVig(){
  if(!vigCache||vigCache.W!==W||vigCache.H!==H){
    const v=ctx.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.9);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.55)');
    vigCache={g:v,W,H};
  }
  return vigCache.g;
}

// ── Track list ──
function buildTrackList(){
  const el=document.getElementById('trackList'); el.innerHTML='';
  tracks.forEach((t,i)=>{
    const d=document.createElement('div'); d.className='track-item';
    d.innerHTML=`<div class="t-dot" style="background:${t.color}" onclick="pickTrackColor(${i},this)"></div>
      <div class="t-name">${t.name}</div>
      <button class="t-mute${t.muted?' on':''}" onclick="tracks[${i}].muted=!tracks[${i}].muted;this.classList.toggle('on')">${t.muted?'S':'M'}</button>`;
    el.appendChild(d);
  });
}
function pickTrackColor(i,dot){
  const inp=document.createElement('input'); inp.type='color'; inp.value=tracks[i].color;
  inp.oninput=e=>{tracks[i].color=e.target.value;dot.style.background=e.target.value;};
  inp.click();
}

// ── Drop zones ──
function dzOver(e,id){e.preventDefault();document.getElementById(id).classList.add('over');}
function dzLeave(id){document.getElementById(id).classList.remove('over');}
function dzDrop(e,type){
  e.preventDefault();
  document.getElementById(type==='midi'?'dzMidi':'dzAudio').classList.remove('over');
  const f=e.dataTransfer.files[0]; if(!f)return;
  if(type==='midi'){
    if(!f.name.match(/\.(mid|midi)$/i)){alert('MIDI files only (.mid/.midi)');return;}
    handleMIDIFile(f);
  }else{
    if(!f.type.startsWith('audio/')&&!f.name.match(/\.(mp3|wav|m4a|ogg|aac)$/i)){alert('Audio files only (mp3/wav/m4a)');return;}
    handleAudioFile(f);
  }
}

// ── MIDI parser ──
function handleMIDIFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const result=parseMIDI(e.target.result);
      if(result){
        midiLoaded=true;
        document.getElementById('midiFileName').textContent=f.name;
        document.getElementById('dzMidi').classList.add('loaded-midi');
        document.getElementById('bpmD').textContent=bpm;
        buildTrackList();
        checkBoth();
      }else alert('parseMIDI returned false');
    }catch(err){alert('MIDI error: '+err.message);}
  };
  r.readAsArrayBuffer(f);
}
function parseMIDI(buf){
  const b=new Uint8Array(buf); let p=0;
  const r1=()=>b[p++];
  const r2=()=>((r1()<<8)|r1());
  const r4=()=>((r1()<<24)|(r1()<<16)|(r1()<<8)|r1());
  const rv=()=>{let v=0,c;do{c=r1();v=(v<<7)|(c&0x7f);}while(c&0x80);return v;};
  if(r4()!==0x4d546864)return false;
  r4(); const fmt=r2(); const ntr=r2(); const div=r2();
  tpb=div; tracks=[]; notes=[]; bpm=120; let maxTick=0;
  for(let tr=0;tr<ntr;tr++){
    if(r4()!==0x4d54726b)return false;
    const len=r4(); const end=p+len;
    let tick=0,lastStatus=0;
    const trNotes={};
    const tColor=presetTracks[tr%presetTracks.length]||TCOLORS[tr%TCOLORS.length];
    const trObj={name:'Track '+(tr+1),color:tColor,muted:false};
    const trIdx=tracks.length; tracks.push(trObj);
    while(p<end){
      const dt=rv(); tick+=dt;
      let status=b[p];
      if(status&0x80){lastStatus=status;p++;}else status=lastStatus;
      const cmd=status&0xf0; const ch=status&0x0f;
      if(cmd===0x90){
        const nt=r1(),vel=r1();
        if(vel>0){trNotes[nt]={s:tick,v:vel};}
        else if(trNotes[nt]){notes.push({t:trIdx,pitch:nt,s:trNotes[nt].s,e:tick,v:trNotes[nt].v});delete trNotes[nt];if(tick>maxTick)maxTick=tick;}
      }else if(cmd===0x80){
        const nt=r1();r1();
        if(trNotes[nt]){notes.push({t:trIdx,pitch:nt,s:trNotes[nt].s,e:tick,v:trNotes[nt].v});delete trNotes[nt];if(tick>maxTick)maxTick=tick;}
      }else if(cmd===0xa0||cmd===0xb0||cmd===0xe0){r1();r1();}
      else if(cmd===0xc0||cmd===0xd0){r1();}
      else if(status===0xff){const mt=r1(),ml=rv();if(mt===0x51&&ml===3){bpm=Math.round(60000000/((r1()<<16)|(r1()<<8)|r1()));}else for(let i=0;i<ml;i++)r1();}
      else if(status===0xf0){let c;do{c=r1();}while(c!==0xf7);}
      else r1();
    }
    p=end;
    Object.entries(trNotes).forEach(([nt,v])=>{if(v)notes.push({t:trIdx,pitch:+nt,s:v.s,e:maxTick,v:v.v});});
  }
  // Remove empty tracks
  const usedTr=new Set(notes.map(n=>n.t));
  tracks=tracks.filter((_,i)=>usedTr.has(i));
  notes.forEach(n=>{const old=n.t;n.t=Array.from(usedTr).indexOf(old);});
  totalTicks=maxTick; return true;
}

// ── Audio ──
function handleAudioFile(f){
  if(!f)return;
  if(audioEl){audioEl.pause();audioEl.src='';}
  audioEl=new Audio();
  audioEl.src=URL.createObjectURL(f);
  audioEl.volume=.8;
  document.getElementById('audioFileName').textContent=f.name;
  document.getElementById('dzAudio').classList.add('loaded-audio');
  checkBoth();
}

// ── Start ──
function checkBoth(){
  if(!midiLoaded)return;
  // Show MIDI as loaded but keep drop screen open for audio
  if(!audioEl){
    // MIDI loaded, waiting for audio — update UI but don't dismiss
    document.getElementById('dzMidi').classList.add('loaded-midi');
    return;
  }
  // Both loaded — dismiss and start
  document.getElementById('dropscreen').style.display='none';
  if(!playing)togglePlay();
  audioEl.currentTime=0;
  audioEl.play().catch(()=>{});
}

// ── Playback ──
function togglePlay(){
  playing=!playing;
  const btn=document.getElementById('playBtn');
  btn.textContent=playing?'⏸':'▶';
  btn.classList.toggle('playing',playing);
  if(playing&&audioEl&&audioEl.paused){
    audioEl.currentTime=(playPos/(tpb*(bpm/60)));
    audioEl.play().catch(()=>{});
  }else if(!playing&&audioEl)audioEl.pause();
}
function seek(pos){
  playPos=Math.max(0,Math.min(totalTicks,pos));
  if(audioEl)audioEl.currentTime=playPos/(tpb*(bpm/60));
}
function resetToDropScreen(){
  if(playing)togglePlay();
  if(audioEl)audioEl.pause();
  playPos=0;ripples=[];
  document.getElementById('dropscreen').style.display='flex';
  document.getElementById('dzMidi').classList.remove('loaded-midi');
  document.getElementById('dzAudio').classList.remove('loaded-audio');
  document.getElementById('midiFileName').textContent='no file loaded';
  document.getElementById('audioFileName').textContent='optional';
  midiLoaded=false;tracks=[];notes=[];
  document.getElementById('trackList').innerHTML='';
  document.getElementById('bpmD').textContent='—';
}

function setOpt(k,v,el){
  if(k==='shape')shape=v;
  document.querySelectorAll('#'+el.parentNode.id+' .sbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
function toggleFX(k,el){fx[k]=!fx[k];el.classList.toggle('on',fx[k]);}

function fmtTime(t){
  const s=t/(tpb*(bpm/60));
  const m=Math.floor(s/60),ss=Math.floor(s%60);
  return m+':'+(ss<10?'0':'')+ss;
}

// ── Draw ──
function draw(){
 try{
  // Background
  ctx.fillStyle=bgColor; ctx.fillRect(0,0,W,H);

  // Vignette
  ctx.fillStyle=getVig(); ctx.fillRect(0,0,W,H);

  // Stars
  drawStars();

  if(!notes.length){
    ctx.fillStyle=bgColor;ctx.fillRect(0,0,W,H);
    drawStars();
    return;
  }

  const tps=tpb*(bpm/60);
  const pxPT=W/(tps*3/zoom);
  const px=W*0.5;
  const minP=Math.min(...notes.map(n=>n.pitch))-1;
  const maxP=Math.max(...notes.map(n=>n.pitch))+1;
  const range=Math.max(maxP-minP,16);
  const rowH=(H*.88)/range;
  const nH=Math.max(4,rowH*noteHPct);
  const horizY=H*.5;

  // Sort — inactive behind, active on top
  const sorted=[...notes].sort((a,b)=>{
    const aA=a.s<=playPos&&a.e>=playPos;
    const bA=b.s<=playPos&&b.e>=playPos;
    return aA===bA?0:aA?1:-1;
  });

  sorted.forEach(n=>{
    if(tracks[n.t]&&tracks[n.t].muted)return;
    const x=px+(n.s-playPos)*pxPT;
    const ex=px+(n.e-playPos)*pxPT;
    if(ex<-60||x>W+60)return;
    const nw=Math.max(2,ex-x);
    const ny=H*.06+(maxP-n.pitch)*rowH;
    const active=n.s<=playPos&&n.e>=playPos;
    const col=tracks[n.t]?tracks[n.t].color:TCOLORS[n.t%TCOLORS.length];

    // ── Depth / perspective ──
    const visT=tps*3/zoom;
    const dist=Math.abs((n.s+n.e)/2-playPos);
    const rawD=Math.min(1,dist/(visT*.5));
    const perpScale=active?1:Math.max(.12,1-rawD*rawD*depth);
    const noteC=ny+nH*.5;
    const newC=noteC+(horizY-noteC)*(1-perpScale)*depth*.9;
    const nH3=Math.max(1,nH*perpScale);
    const ny3=newC-nH3*.5;
    const fade=active?1:Math.max(.12,perpScale*.85);

    const r2=parseInt(col.slice(1,3),16);
    const g2=parseInt(col.slice(3,5),16);
    const b2=parseInt(col.slice(5,7),16);
    const rad=shape==='round'?Math.min(4,nH3*.4):0;
    const vel=.45+n.v/127*.55;

    if(active){
      // Bloom
      if(fx.glow&&bloomR>0){ctx.shadowBlur=bloomR;ctx.shadowColor=col;}

      // Halo — guard against zero-length gradient
      const pad=Math.max(1,nH3*1.6);
      const hGy0=ny3-pad, hGy1=ny3+nH3+pad;
      const hG=ctx.createLinearGradient(x,hGy0,x,hGy1===hGy0?hGy0+1:hGy1);
      hG.addColorStop(0,`rgba(${r2},${g2},${b2},0)`);
      hG.addColorStop(.5,`rgba(${r2},${g2},${b2},${.18*vel})`);
      hG.addColorStop(1,`rgba(${r2},${g2},${b2},0)`);
      ctx.globalAlpha=1;ctx.fillStyle=hG;ctx.fillRect(x,hGy0,nw,nH3+pad*2);

      // Body gradient — guard against zero-length gradient
      ctx.globalAlpha=vel;
      const bGy1=ny3+Math.max(1,nH3);
      const bG=ctx.createLinearGradient(x,ny3,x,bGy1);
      bG.addColorStop(0,`rgba(255,255,255,.92)`);
      bG.addColorStop(.07,`rgba(${Math.min(255,r2+120)},${Math.min(255,g2+120)},${Math.min(255,b2+120)},1)`);
      bG.addColorStop(.35,`rgba(${r2},${g2},${b2},1)`);
      bG.addColorStop(.8,`rgba(${Math.round(r2*.55)},${Math.round(g2*.55)},${Math.round(b2*.55)},1)`);
      bG.addColorStop(1,`rgba(${Math.round(r2*.15)},${Math.round(g2*.15)},${Math.round(b2*.15)},1)`);
      ctx.fillStyle=bG;
      if(rad>0){ctx.beginPath();ctx.roundRect(x,ny3,nw,Math.max(1,nH3),rad);ctx.fill();}
      else ctx.fillRect(x,ny3,nw,Math.max(1,nH3));
      ctx.shadowBlur=0;

      // Center highlight line — guard against zero width
      if(nw>2){
        const cly=ny3+nH3*.32;
        const clG=ctx.createLinearGradient(x,0,x+nw,0);
        clG.addColorStop(0,'rgba(255,255,255,0)');
        clG.addColorStop(.08,`rgba(255,255,255,${.95*vel})`);
        clG.addColorStop(.5,`rgba(255,255,255,${vel})`);
        clG.addColorStop(.92,`rgba(255,255,255,${.95*vel})`);
        clG.addColorStop(1,'rgba(255,255,255,0)');
        ctx.globalAlpha=1;ctx.fillStyle=clG;
        ctx.fillRect(x,cly,nw,Math.max(1.5,nH3*.2));
      }

      // Ripple
      if(fx.rip&&Math.random()>.96)ripples.push({x:x+nw/2,y:ny3+nH3/2,r:0,life:1,col});

    }else{
      // Inactive note
      ctx.globalAlpha=fade;
      const iGy1=ny3+Math.max(1,nH3);
      const iG=ctx.createLinearGradient(x,ny3,x,iGy1);
      iG.addColorStop(0,`rgba(${Math.min(255,r2+40)},${Math.min(255,g2+40)},${Math.min(255,b2+40)},1)`);
      iG.addColorStop(.5,`rgba(${r2},${g2},${b2},1)`);
      iG.addColorStop(1,`rgba(${Math.round(r2*.3)},${Math.round(g2*.3)},${Math.round(b2*.3)},1)`);
      ctx.fillStyle=iG;
      if(rad>0){ctx.beginPath();ctx.roundRect(x,ny3,nw,Math.max(1,nH3),rad);ctx.fill();}
      else ctx.fillRect(x,ny3,nw,Math.max(1,nH3));
      if(nH3>4){
        ctx.globalAlpha=fade*.3;
        ctx.fillStyle='rgba(255,255,255,.5)';
        ctx.fillRect(x+2,ny3+nH3*.32,nw-4,Math.max(1,nH3*.18));
      }
    }
    ctx.globalAlpha=1;
  });

  // Ripples
  for(let i=ripples.length-1;i>=0;i--){
    const rv=ripples[i]; rv.r+=3.5; rv.life-=.028;
    if(rv.life<=0){ripples.splice(i,1);continue;}
    ctx.globalAlpha=rv.life*.45;
    ctx.strokeStyle=rv.col;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(rv.x,rv.y,rv.r,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }

  // Playhead
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.setLineDash([4,8]);
  ctx.beginPath();ctx.moveTo(W*.5,0);ctx.lineTo(W*.5,H);ctx.stroke();
  ctx.setLineDash([]);

  // Progress
  const pct=totalTicks>0?Math.min(100,playPos/totalTicks*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('timeD').textContent=fmtTime(playPos)+' / '+fmtTime(totalTicks);
 }catch(err){console.error('draw error:',err);}
}

// ── Main loop ──
function loop(t){
  requestAnimationFrame(loop);
  if(playing){
    if(audioEl&&audioEl.duration>0&&!audioEl.paused){
      const tps=tpb*(bpm/60);
      const now=performance.now();
      const ct=audioEl.currentTime;
      if(ct!==lastAudioTime){lastAudioTime=ct;lastAudioReadT=now;}
      const interp=ct+(now-lastAudioReadT)/1000;
      playPos=Math.max(0,interp)*tps;
      if(audioEl.ended){audioEl.currentTime=0;playPos=0;audioEl.play().catch(()=>{});}
    }else if(!audioEl||audioEl.duration===0){
      if(lastT){
        const dt=(t-lastT)/1000;
        playPos+=dt*(tpb*(bpm/60))*speed;
        if(playPos>=totalTicks)playPos=0;
      }
      lastT=t;
    }
  }else lastT=t;
  draw();
}

// ── Transport seek ──
document.getElementById('progWrap').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  seek((e.clientX-r.left)/r.width*totalTicks);
});

// ── Export ──
function doExport(){
  if(!midiLoaded){alert('Load a MIDI file first');return;}
  const btn=document.getElementById('exportVidBtn');
  const fmts=[
    {m:'video/webm;codecs=vp9,opus',e:'webm'},
    {m:'video/webm;codecs=vp8,opus',e:'webm'},
    {m:'video/webm',e:'webm'}
  ];
  let chosen=null;
  for(const f of fmts){try{if(MediaRecorder.isTypeSupported(f.m)){chosen=f;break;}}catch(e){}}
  if(!chosen){alert('Video export not supported. Use Chrome.');return;}

  const fps=60;
  const totalFrames=Math.ceil(totalTicks/(tpb*(bpm/60))*fps);
  const bitrate=8000000;
  const stream=canvas.captureStream(fps);
  let combinedStream=stream;

  if(audioEl){
    try{
      const actx=new AudioContext();
      const src=actx.createMediaElementSource(audioEl);
      const dest=actx.createMediaStreamDestination();
      src.connect(dest); src.connect(actx.destination);
      const tracks=[...stream.getTracks(),...dest.stream.getTracks()];
      combinedStream=new MediaStream(tracks);
    }catch(e){}
  }

  const recorder=new MediaRecorder(combinedStream,{mimeType:chosen.m,videoBitsPerSecond:bitrate});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data);};

  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:chosen.m});
    const fname='GlitchRealm_'+Date.now()+'.'+chosen.e;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    btn.textContent='Export Video';btn.disabled=false;
  };

  const savedPos=playPos;
  const tps=tpb*(bpm/60);
  const ticksPerFrame=tps/fps;
  let frame=0;
  playPos=0;
  if(audioEl){audioEl.currentTime=0;audioEl.play().catch(()=>{});}
  recorder.start();
  btn.textContent='Bouncing 0%';btn.disabled=true;

  // Fullscreen overlay
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:monospace';
  ov.innerHTML=`<div style="font-size:12px;letter-spacing:4px;color:#22d3ee">GLITCHREALM EXPORT</div>
    <canvas id="ovCv" style="max-width:88vw;max-height:65vh;border:1px solid #1a2535;border-radius:6px"></canvas>
    <div id="ovPct" style="font-size:11px;color:#445;letter-spacing:2px">RENDERING 0%</div>
    <div style="width:360px;height:2px;background:#1a2535;border-radius:1px"><div id="ovBar" style="height:100%;background:#22d3ee;border-radius:1px;width:0%"></div></div>`;
  document.body.appendChild(ov);
  const ovCv=document.getElementById('ovCv');
  ovCv.width=canvas.width;ovCv.height=canvas.height;

  function renderFrame(){
    if(frame>=totalFrames){
      recorder.requestData();
      setTimeout(()=>{
        recorder.stop();
        if(audioEl)audioEl.pause();
        ov.remove();
        playPos=savedPos;
      },200);
      return;
    }
    playPos=frame*ticksPerFrame;
    draw();
    if(frame%15===0){
      const bctx=ovCv.getContext('2d');bctx.drawImage(canvas,0,0);
      const pct=Math.round(frame/totalFrames*100);
      document.getElementById('ovPct').textContent='RENDERING '+pct+'%';
      document.getElementById('ovBar').style.width=pct+'%';
      btn.textContent='Bouncing '+pct+'%';
    }
    frame++;
    requestAnimationFrame(renderFrame);
  }
  setTimeout(()=>requestAnimationFrame(renderFrame),300);
}

// ── Init ──
initStars();
applyPreset('aurora');
requestAnimationFrame(loop);
</script>
